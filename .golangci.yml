version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck

linters-settings:
  errcheck:
    check-type-assertions: false

issues:
  exclude-rules:
    # Test files have looser standards
    - path: "_test\\.go"
      linters:
        - errcheck
    # Generated or embedded files
    - path: "dist/"
      linters:
        - all
